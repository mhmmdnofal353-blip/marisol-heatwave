<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marisol Heatwave — an open-world crime game</title>
<style>
  /* The game is one full-window canvas; the page itself never scrolls. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #101d26; }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  /* Visually hidden but announced: a live status line for screen readers. */
  #status { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Marisol Heatwave. Roam Marisol Bay on foot and by car, take work from Vera Solano, hunt the hidden parcels glowing across the districts, and stay ahead of the MBPD. Move and drive with WASD, aim with the mouse, scroll to zoom, press F to get into cars and H to honk."></canvas>
<p id="status" role="status" aria-live="polite">Marisol Heatwave is loading.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
